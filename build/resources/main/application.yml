server:
  port: 8080

spring:
  application:
    name: notification-system
  datasource:
    url: jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

notification:
  dispatch:
    worker-count: 4
    reconciliation-interval-millis: 500
    rate-limit-retry-delay-millis: 2000
    stuck-pending-threshold-millis: 5000

  rate-limit:
    user:
      capacity: 20
      refill-per-second: 5
    channel:
      capacity: 50
      refill-per-second: 15

  retry:
    default-policy:
      max-retries: 3
      initial-backoff-millis: 1000
      multiplier: 2.0
      max-backoff-millis: 10000
    channels:
      EMAIL:
        max-retries: 5
        initial-backoff-millis: 1000
        multiplier: 2.0
        max-backoff-millis: 10000
      SMS:
        max-retries: 3
        initial-backoff-millis: 800
        multiplier: 2.0
        max-backoff-millis: 8000
      PUSH:
        # Fixed backoff, demonstrated as an exponential curve with multiplier 1.0
        max-retries: 4
        initial-backoff-millis: 1000
        multiplier: 1.0
        max-backoff-millis: 1000

logging:
  level:
    com.notifications: INFO
